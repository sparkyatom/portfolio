# Backend + PostgreSQL with a persistent volume. Frontend is a static site (see README).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: portfolio, POSTGRES_PASSWORD: change-me, POSTGRES_DB: portfolio }
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment: { DATABASE_URL: "postgresql://portfolio:change-me@db:5432/portfolio" }
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
